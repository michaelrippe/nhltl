     <div className="nhl-d"><table style=${{width:"100%"}}><thead><tr style=${{background:LN}}>${["TEAM","MGR","GP","W","L","OTL","DIFF","STK"].map(function(x){return html`<th key=${x} style=${{padding:"6px",fontSize:12,fontWeight:800,textAlign:x==="TEAM"||x==="MGR"?"left":"center"}}>${x}</th>`})}</tr></thead>
     <tbody>${srt.map(function(t,i){var v=rec(t),df=v.gf-v.ga;return html`<tr key=${t} data-team=${t} style=${{borderTop:i===3?"2px dashed #CBD5E1":"1px solid #F3F4F6"}}>
      <td style=${{padding:"6px",fontSize:13}}><${Tm} name=${t} sz=${14} elim=${isElim(t)} /></td>
      <td style=${{padding:"6px",fontSize:12,color:O,fontWeight:800}}>${getOwner(t)}</td>
      <td className="gp" style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${gp(t)}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center",fontWeight:800}}>${v.w}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${v.l}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center"}}>${v.otl}</td>
      <td style=${{padding:"6px",fontSize:12,textAlign:"center",color:df>=0?GR:RD}}>${df>0?"+":""}${df}</td>
      <td style=${{padding:"6px",textAlign:"center"}}><${Stk} v=${v.stk} /></td>
     </tr>`})}</tbody></table></div>
     <div className="nhl-m">${srt.map(function(t,i){var v=rec(t),df=v.gf-v.ga;return html`<div key=${t} className="nhl-row" data-team=${t} style=${{borderTop:i===3?"2px dashed #CBD5E1":"1px solid #F3F4F6"}}>
      <div style=${{display:"flex",justifyContent:"space-between",gap:8,alignItems:"center"}}><${Tm} name=${t} sz=${16} elim=${isElim(t)} /><${Stk} v=${v.stk} /></div>
      <div className="lbl" style=${{display:"flex",justifyContent:"space-between",marginTop:4,fontWeight:800}}>
       <span style=${{color:O}}>${getOwner(t)}</span><span>GP ${gp(t)}</span><span>${v.w}-${v.l}-${v.otl}</span><span style=${{color:df>=0?GR:RD}}>${df>0?"+":""}${df}</span>
      </div>
     </div>`})}</div>
    </${Cd}>`})}
   </div>
   <div className="lbl" style=${{color:GY,marginTop:8}}>Sorted by wins. Dashed line = top 3 in the division. Streaks are ESPN's, when the feed includes them.</div>
  </div>`):null}

  ${tab==="history"?html`<div style=${{animation:"fadeIn .25s"}}>
   <div className="prizes">
    <div className="pot" style=${{background:LO,borderColor:"#BFDBFE"}}><div className="pot-kicker" style=${{color:O}}>2025-26 REGULAR SEASON CHAMPION</div><div className="pot-val">🏆 Rippe</div><div className="pot-sub">369 wins · won by 38 · $150</div></div>
    <div className="pot" style=${{background:"#FFFBEB",borderColor:"#FDE68A"}}><div className="pot-kicker" style=${{color:"#B45309"}}>2026 STANLEY CUP SIDE BET</div><div className="pot-val">🥤 Swag</div><div className="pot-sub" style=${{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}><${Tm} name="Hurricanes" sz=${14} /> def. Golden Knights 4-2 · $75</div></div>
   </div>
   <${Cd} s=${{marginBottom:16}}><${Hd} r="FINAL">2025-26 FINAL STANDINGS</${Hd}>
    ${HIST.mgrs.map(function(m,i){return html`<div key=${m.name} style=${{padding:"12px 16px",borderTop:i?"1px solid #F3F4F6":"none",background:i===0?LO:"#fff"}}>
     <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6,gap:8}}>
      <span style=${Object.assign({fontWeight:900,fontSize:16},serif)}>${i+1}. ${m.name}</span>
      <span style=${Object.assign({fontWeight:900,fontSize:18,color:i===0?O:N},serif)}>${m.tw} <span style=${{fontSize:12,color:GY,fontFamily:"inherit"}}>${i===0?"":"(-"+(HIST.mgrs[0].tw-m.tw)+")"}</span></span>
     </div>
     <div style=${{display:"flex",flexWrap:"wrap",gap:"4px 12px"}}>${m.teams.map(function(t){return html`<span key=${t[0]} style=${{fontSize:12}}><${Tm} name=${t[0]} sz=${12} /> <b>${t[1]}</b></span>`})}</div>
    </div>`})}
   </${Cd}>
  </div>`:null}

  ${tab==="rules"?html`<div style=${{animation:"fadeIn .25s"}}><${Cd} s=${{marginBottom:16}}><${Hd}>OFFICIAL RULES</${Hd}><div style=${{padding:"16px"}}>
   <div style=${Object.assign({fontSize:16,fontWeight:900,marginBottom:12},serif)}>WINS ARE ALL THAT MATTER</div>
   ${[["THE GAME","4 managers draft 8 NHL teams each. Most combined regular season wins across all 8 teams wins the league."],["DRAFT","Snake format, 8 rounds, all 32 NHL teams. 2026-27 order: Gainzy, Gallup, Swaggy, Rippe."],["SCORING","Regulation, overtime and shootout wins all count as 1 win. Losses of any kind count for nothing."],["TIEBREAKER","If tied on total wins, the manager whose single best team has the most wins takes it."],["REG SEASON POT","$50 buy-in. Most wins at season's end takes $150."],["STANLEY CUP SIDE BET","$25 buy-in. Own the Cup - take the pot. The manager who drafted the Stanley Cup champion takes $75."]].map(function(x){return html`<div key=${x[0]} style=${{marginBottom:12}}><div style=${{fontSize:12,fontWeight:800,color:O,letterSpacing:".06em"}}>${x[0]}</div><div style=${{fontSize:14,lineHeight:1.5}}>${x[1]}</div></div>`})}
  </div></${Cd}></div>`:null}
 </div>
 <section className="interest" id="interest" aria-labelledby="interest-title">
  <h2 id="interest-title">Want in next season?</h2>
  ${interest==="done"?html`<p className="note ok" role="status">You're on the list. Thanks!</p>`:html`<form onSubmit=${submitInterest} noValidate>
   <p className="sub">Get updates on new Team League games, the app, and how to join.</p>
   <label htmlFor="interest-name">Name <span className="opt">(optional)</span></label>
   <input id="interest-name" name="name" type="text" maxLength="60" autoComplete="name" />
   <label htmlFor="interest-email">Email</label>
   <input id="interest-email" name="email" type="email" required maxLength="120" autoComplete="email" aria-invalid=${interest==="bad"?"true":"false"} aria-describedby=${interest==="bad"||interest==="error"?"interest-note":null} />
   <div className="hp" aria-hidden="true">
    <label htmlFor="interest-website">Website</label>
    <input id="interest-website" name="website" type="text" tabIndex="-1" autoComplete="off" />
   </div>
   <button type="submit" className="share-btn" style=${{marginTop:12}} disabled=${interest==="sending"}>Notify me</button>
   ${interest==="bad"?html`<p className="note bad" id="interest-note" role="alert">Enter a valid email.</p>`:null}
   ${interest==="error"?html`<p className="note bad" id="interest-note" role="alert">Couldn't save right now. Try again later.</p>`:null}
  </form>`}
 </section>
 <div className="footer">NHL Team League ${SEASON} · Est. 2025 · Defending Champ: Rippe · Cup: Swag</div>
</div>`;
}
if(!window.htm||!window.React||!window.ReactDOM){
 document.getElementById("root").textContent="This page couldn't load. Refresh to try again.";
}else{
 ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
}
</script>
</body>
